name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          if [ "${{ matrix.laravel }}" = "12.*" ]; then
            composer update --with laravel/framework:^12.0 --with orchestra/testbench:^10.0 --with pestphp/pest:^3.0 --with pestphp/pest-plugin-laravel:^3.0 -W --no-interaction --prefer-dist
          else
            composer update --with laravel/framework:^13.0 -W --no-interaction --prefer-dist
          fi
      - run: vendor/bin/pest
